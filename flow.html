<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Cost of Saving: in, system, out (draft)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- DRAFT, 2026-10-11. A streamlined front page: one decision on one screen, read as
     in -> system -> out. Not listed in build-site.js, so it is not on the live site.
     Open this file straight from the folder. -->
<style>
  :root {
    color-scheme: dark;
    --page: #0f172a; --surface: #1e293b; --paper: #0f172a; --ink: #f8fafc; --ink-2: #cbd5e1; --muted: #94a3b8;
    --line: #334155; --accent: #14b8a6; --on-accent: #0f172a;
    --good-text: #86efac; --bad-text: #fca5a5; --mixed-text: #fcd34d;
  }
  body { background: var(--page); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 28px 16px 56px; }
  .wrap { max-width: 1060px; margin: 0 auto; display: grid; gap: 20px; }
  h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.05; margin: 0; }
  h2 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }
  p { margin: 0; }
  .lede { color: var(--ink-2); max-width: 60ch; }
  .hint { font-size: 14px; color: var(--muted); }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  select, input { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; box-sizing: border-box; }
  .bar select { width: auto; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button, #parts button { font: 700 15px inherit; color: var(--ink-2); background: var(--surface); border: 0; padding: 8px 14px; cursor: pointer; }
  .seg button[aria-pressed="true"], #parts button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  #parts { display: inline-flex; gap: 6px; }
  #parts button { border-radius: 8px; border: 1px solid var(--line); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .flow { display: grid; grid-template-columns: 1fr auto 1.2fr auto 1.2fr; gap: 12px; align-items: stretch; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; align-content: start; }
  .arrow { align-self: center; color: var(--muted); font-size: 26px; }
  label { display: grid; gap: 4px; font-size: 14px; color: var(--ink-2); }
  .pair { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .pair span { color: var(--ink-2); font-size: 15px; }
  .pair i { display: block; font-style: normal; font-size: 13px; color: var(--muted); }
  .pair b { font-size: 20px; white-space: nowrap; }
  .pair.total b { font-size: 30px; }
  .verdict { font-weight: 800; font-size: 20px; }
  .good, .good b { color: var(--good-text); } .bad, .bad b { color: var(--bad-text); } .mixed, .mixed b { color: var(--mixed-text); }
  .kind-tag { display: grid; grid-template-columns: 132px 1fr; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .kind-tag svg { width: 132px; height: 72px; display: block; }
  .kind-tag b { font-size: 16px; }
  .kind-plain { color: var(--muted); font-size: 14px; }
  .kind-why { display: block; color: var(--ink-2); font-size: 14px; }
  @media (max-width: 860px) { .flow { grid-template-columns: 1fr; } .arrow { justify-self: center; transform: rotate(90deg); } }
</style>

<div class="wrap">
  <header>
    <h1>What goes in, what it passes through, what comes out.</h1>
    <p class="lede">A saving is what goes in. The business it passes through decides what comes out.</p>
  </header>

  <div class="bar">
    <select id="example" aria-label="Decision"></select>
    <span class="seg" id="direction" role="group" aria-label="Direction">
      <button type="button" data-dir="forward">Set in and system, read out</button>
      <button type="button" data-dir="reverse">Hold out, read in and system</button>
    </span>
  </div>
  <p class="hint" id="note"></p>

  <div class="flow">
    <section class="panel">
      <h2>In</h2>
      <label>Saving each year ($)<input id="saving" inputmode="decimal"></label>
      <label>One-time cost of the change ($)<input id="oneTime" inputmode="decimal"></label>
      <label>Years to look ahead<input id="years" inputmode="decimal"></label>
    </section>
    <div class="arrow" aria-hidden="true">&rarr;</div>
    <section class="panel">
      <h2>System</h2>
      <label>Income a year that relies on it ($)<input id="dependentValue" inputmode="decimal"></label>
      <label>How much of it is cut (%)<input id="cutShare" inputmode="decimal"></label>
      <label>How much of that was spare (%)<input id="spareShare" inputmode="decimal"></label>
      <label>How much of the spare is kept for busy times (%)<input id="bufferShare" inputmode="decimal"></label>
      <label>Kept from each dollar of that income (%)<input id="margin" inputmode="decimal"></label>
      <label>Parts of the business that rely on it<span id="parts" role="group"></span></label>
    </section>
    <div class="arrow" aria-hidden="true">&rarr;</div>
    <section class="panel" aria-live="polite">
      <h2 id="out-title">Out</h2>
      <img id="out-pig" alt="" src="art/pig-save.png" style="width: 92px; justify-self: end">
      <div id="out"></div>
      <div id="out-kind"></div>
    </section>
  </div>

  <p class="hint">Arithmetic on your own estimates. Nothing you type is sent anywhere.</p>
</div>

<script src="multiple.js"></script>
<script src="kinds.js"></script>
<script src="saving.js"></script>
<script src="saving-examples.js"></script>
<script src="flow-page.js"></script>
</html>
